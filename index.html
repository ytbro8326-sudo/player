<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayersMoy — Ultimate M3U8 & HLS Video Player</title>
  <!-- HLS.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- Custom Styles (inlined) -->
  <style>
:root {
  --bg: #0b0c10;
  --panel-bg: #1f2833;
  --card-bg: #141a22;
  --accent: #45a29e;
  --accent-bright: #66fcf1;
  --text-main: #c5c6c7;
  --text-bright: #ffffff;
  --muted: #667085;
  --border: #2c3540;
  --red: #ff4d4d;
  --green: #2ecc71;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  --radius: 12px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text-main);
  font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Header */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  background: rgba(31, 40, 51, 0.8);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-icon {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--accent), var(--accent-bright));
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #000;
  font-weight: 900;
  font-size: 1.1rem;
}

.brand-title {
  font-size: 1.25rem;
  font-weight: 800;
  color: var(--text-bright);
  letter-spacing: -0.5px;
}

.brand-title span {
  color: var(--accent-bright);
}

.badge-tag {
  font-size: 0.65rem;
  background: rgba(102, 252, 241, 0.15);
  color: var(--accent-bright);
  border: 1px solid rgba(102, 252, 241, 0.3);
  padding: 3px 8px;
  border-radius: 20px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

/* Main Container */
.player-container {
  max-width: 1200px;
  width: 95%;
  margin: 20px auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
  flex: 1;
}

/* Video Frame Wrapper */
.video-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000000;
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

video {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  background: #000;
}

.iframe-container {
  display: none;
  position: absolute;
  inset: 0;
  background: #000;
}

.iframe-container iframe {
  width: 100%;
  height: 100%;
  border: none;
}

.mode-badge {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 10;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(8px);
  color: var(--accent-bright);
  font-size: 0.7rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid rgba(102, 252, 241, 0.3);
  pointer-events: none;
}

/* Control Overlay */
.video-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.4) 70%, transparent);
  padding: 24px 16px 12px;
  opacity: 0;
  transition: opacity 0.25s ease;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.video-wrapper:hover .video-overlay,
.video-wrapper.paused .video-overlay {
  opacity: 1;
}

/* Custom Seek Bar */
.seekbar-container {
  position: relative;
  height: 6px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 4px;
  cursor: pointer;
  transition: height 0.15s ease;
}

.seekbar-container:hover {
  height: 8px;
}

.seekbar-buffered {
  position: absolute;
  top: 0;
  height: 100%;
  background: rgba(255, 255, 255, 0.35);
  border-radius: 4px;
  width: 0%;
}

.seekbar-progress {
  position: absolute;
  top: 0;
  height: 100%;
  background: var(--accent-bright);
  border-radius: 4px;
  width: 0%;
}

.seekbar-thumb {
  position: absolute;
  top: 50%;
  width: 14px;
  height: 14px;
  background: #ffffff;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  opacity: 0;
  transition: opacity 0.15s ease;
  box-shadow: 0 0 8px rgba(102, 252, 241, 0.8);
}

.seekbar-container:hover .seekbar-thumb {
  opacity: 1;
}

/* Controls Row */
.controls-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn-ctrl {
  background: transparent;
  border: none;
  color: var(--text-bright);
  font-size: 1.1rem;
  cursor: pointer;
  padding: 6px 8px;
  border-radius: 6px;
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn-ctrl:hover {
  background: rgba(255, 255, 255, 0.15);
  color: var(--accent-bright);
}

.time-display {
  font-size: 0.8rem;
  color: var(--text-bright);
  font-weight: 500;
  white-space: nowrap;
}

.volume-wrapper {
  display: flex;
  align-items: center;
  gap: 6px;
}

.volume-slider {
  width: 70px;
  accent-color: var(--accent-bright);
  cursor: pointer;
}

.spacer {
  flex: 1;
}

.select-ctrl {
  background: rgba(20, 26, 34, 0.85);
  border: 1px solid var(--border);
  color: var(--text-bright);
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 0.75rem;
  outline: none;
  cursor: pointer;
}

/* Dashboard Panel */
.control-panel {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.input-group {
  display: flex;
  gap: 10px;
}

.input-field {
  flex: 1;
  background: var(--panel-bg);
  border: 1px solid var(--border);
  color: var(--text-bright);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 0.88rem;
  outline: none;
  transition: border-color 0.2s ease;
}

.input-field:focus {
  border-color: var(--accent-bright);
}

.btn-action {
  background: linear-gradient(135deg, var(--accent), var(--accent-bright));
  color: #000000;
  border: none;
  font-weight: 700;
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
  transition: opacity 0.2s ease, transform 0.1s ease;
}

.btn-action:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}

.btn-action.sec {
  background: var(--panel-bg);
  border: 1px solid var(--border);
  color: var(--text-bright);
}

.btn-action.sec:hover {
  border-color: var(--accent-bright);
  color: var(--accent-bright);
}

/* Status Bar */
.status-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.8rem;
  padding: 10px 14px;
  background: var(--panel-bg);
  border-radius: 8px;
  border: 1px solid var(--border);
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--muted);
}

.status-dot.active {
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
}

.status-dot.error {
  background: var(--red);
  box-shadow: 0 0 6px var(--red);
}

.status-text {
  color: var(--text-bright);
  font-weight: 500;
  flex: 1;
}

/* Quick Links Presets */
.preset-list {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.preset-btn {
  background: var(--panel-bg);
  border: 1px solid var(--border);
  color: var(--text-main);
  font-size: 0.75rem;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.preset-btn:hover {
  border-color: var(--accent-bright);
  color: var(--accent-bright);
}

/* Footer */
footer {
  text-align: center;
  padding: 16px;
  font-size: 0.75rem;
  color: var(--muted);
  border-top: 1px solid var(--border);
  margin-top: auto;
}

@media (max-width: 640px) {
  .input-group {
    flex-direction: column;
  }
  .controls-row {
    gap: 6px;
  }
  .volume-slider {
    width: 45px;
  }
}

  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-icon">▶</div>
      <div class="brand-title">Players<span>Moy</span></div>
      <span class="badge-tag">HLS · M3U8 · MP4</span>
    </div>
  </header>

  <!-- Player Main Layout -->
  <main class="player-container">

    <!-- Video Wrapper -->
    <div class="video-wrapper paused" id="vwrap">
      <div class="mode-badge" id="modeBadge">HLS / M3U8</div>

      <!-- HTML5 Video Player -->
      <video id="vid" preload="metadata" playsinline></video>

      <!-- Fallback IFrame Container -->
      <div class="iframe-container" id="iframeWrap">
        <iframe id="iframePlayer" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
      </div>

      <!-- Overlay Custom Controls -->
      <div class="video-overlay" id="overlay">
        <!-- Seek Bar -->
        <div class="seekbar-container" id="seekContainer">
          <div class="seekbar-buffered" id="seekBuf"></div>
          <div class="seekbar-progress" id="seekProg"></div>
          <div class="seekbar-thumb" id="seekThumb"></div>
        </div>

        <!-- Controls Row -->
        <div class="controls-row">
          <button class="btn-ctrl" id="btnPlay" title="Play/Pause (Space)">▶</button>
          <button class="btn-ctrl" id="btnBack" title="-10 Seconds">⏪</button>
          <button class="btn-ctrl" id="btnFwd" title="+10 Seconds">⏩</button>
          
          <div class="volume-wrapper">
            <button class="btn-ctrl" id="btnMute" title="Mute (M)">🔊</button>
            <input type="range" class="volume-slider" id="volSlider" min="0" max="1" step="0.05" value="1">
          </div>

          <span class="time-display" id="timeDisplay">0:00 / 0:00</span>

          <div class="spacer"></div>

          <!-- Quality Dropdown -->
          <select class="select-ctrl" id="qualSelect">
            <option value="-1">Auto Quality</option>
          </select>

          <!-- Playback Speed Dropdown -->
          <select class="select-ctrl" id="speedSelect">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2.0x</option>
          </select>

          <button class="btn-ctrl" id="btnFullscreen" title="Fullscreen (F)">⛶</button>
        </div>
      </div>
    </div>

    <!-- Control & Input Panel -->
    <div class="control-panel">
      
      <!-- Input Group -->
      <div class="input-group">
        <input type="text" class="input-field" id="urlInput" placeholder="Paste .m3u8, .mp4, or embed URL here...">
        
        <select class="select-ctrl" id="proxySelect" style="padding: 10px; border-radius: 8px;">
          <option value="direct" selected>Direct Stream</option>
          <option value="local">Local Proxy (/proxy)</option>
          <option value="corsproxy">CORS Proxy Service</option>
        </select>

        <button class="btn-action" id="btnLoad">Play Stream</button>
      </div>

      <!-- Quick Demo Stream Presets -->
      <div style="font-size: 0.75rem; color: var(--muted); font-weight: 600;">Demo Sample Streams:</div>
      <div class="preset-list">
        <button class="preset-btn" onclick="playersmoy.loadStream('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">
          📺 Big Buck Bunny (M3U8)
        </button>
        <button class="preset-btn" onclick="playersmoy.loadStream('https://playertest.longtailvideo.com/adaptive/oceans/oceans.m3u8')">
          🌊 Ocean Wildlife (M3U8)
        </button>
        <button class="preset-btn" onclick="playersmoy.loadStream('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4')">
          🎬 For Bigger Blazes (MP4)
        </button>
      </div>

      <!-- Status Bar -->
      <div class="status-bar">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Ready — paste an M3U8 or MP4 URL above and press Play Stream.</span>
      </div>

    </div>

  </main>

  <footer>
    PlayersMoy Standalone Package • Powered by HLS.js
  </footer>

  <!-- Script (inlined) -->
  <script>
class PlayersMoy {
  constructor() {
    this.hls = null;
    this.currentUrl = '';
    this.initElements();
    this.bindEvents();
  }

  initElements() {
    this.vwrap = document.getElementById('vwrap');
    this.vid = document.getElementById('vid');
    this.iframeWrap = document.getElementById('iframeWrap');
    this.iframePlayer = document.getElementById('iframePlayer');
    this.modeBadge = document.getElementById('modeBadge');

    // Controls
    this.btnPlay = document.getElementById('btnPlay');
    this.btnBack = document.getElementById('btnBack');
    this.btnFwd = document.getElementById('btnFwd');
    this.btnMute = document.getElementById('btnMute');
    this.volSlider = document.getElementById('volSlider');
    this.timeDisplay = document.getElementById('timeDisplay');
    this.seekContainer = document.getElementById('seekContainer');
    this.seekBuf = document.getElementById('seekBuf');
    this.seekProg = document.getElementById('seekProg');
    this.seekThumb = document.getElementById('seekThumb');
    this.qualSelect = document.getElementById('qualSelect');
    this.speedSelect = document.getElementById('speedSelect');
    this.btnFullscreen = document.getElementById('btnFullscreen');

    // Panel
    this.urlInput = document.getElementById('urlInput');
    this.proxySelect = document.getElementById('proxySelect');
    this.btnLoad = document.getElementById('btnLoad');
    this.statusDot = document.getElementById('statusDot');
    this.statusText = document.getElementById('statusText');
  }

  bindEvents() {
    // Video events
    this.vid.addEventListener('play', () => this.updatePlayBtn(true));
    this.vid.addEventListener('pause', () => this.updatePlayBtn(false));
    this.vid.addEventListener('timeupdate', () => this.updateProgress());
    this.vid.addEventListener('progress', () => this.updateBuffer());

    // Controls
    this.btnPlay.addEventListener('click', () => this.togglePlay());
    this.btnBack.addEventListener('click', () => this.seekBy(-10));
    this.btnFwd.addEventListener('click', () => this.seekBy(10));
    this.btnMute.addEventListener('click', () => this.toggleMute());
    this.volSlider.addEventListener('input', (e) => this.setVolume(e.target.value));

    // Seek bar drag/click
    this.seekContainer.addEventListener('click', (e) => this.seekToPosition(e));

    // Selectors
    this.speedSelect.addEventListener('change', (e) => {
      this.vid.playbackRate = parseFloat(e.target.value);
    });

    this.qualSelect.addEventListener('change', (e) => {
      if (this.hls) {
        this.hls.currentLevel = parseInt(e.target.value);
      }
    });

    this.btnFullscreen.addEventListener('click', () => this.toggleFullscreen());

    // Panel buttons
    this.btnLoad.addEventListener('click', () => {
      const url = this.urlInput.value.trim();
      if (url) this.loadStream(url);
    });

    this.urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const url = this.urlInput.value.trim();
        if (url) this.loadStream(url);
      }
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
      
      switch (e.key.toLowerCase()) {
        case ' ':
        case 'k':
          e.preventDefault();
          this.togglePlay();
          break;
        case 'f':
          e.preventDefault();
          this.toggleFullscreen();
          break;
        case 'm':
          e.preventDefault();
          this.toggleMute();
          break;
        case 'arrowleft':
          e.preventDefault();
          this.seekBy(-5);
          break;
        case 'arrowright':
          e.preventDefault();
          this.seekBy(5);
          break;
        case 'arrowup':
          e.preventDefault();
          this.adjustVolume(0.1);
          break;
        case 'arrowdown':
          e.preventDefault();
          this.adjustVolume(-0.1);
          break;
      }
    });
  }

  setStatus(msg, type = 'normal') {
    this.statusText.textContent = msg;
    this.statusDot.className = 'status-dot';
    if (type === 'success') this.statusDot.classList.add('active');
    if (type === 'error') this.statusDot.classList.add('error');
  }

  formatTime(secs) {
    if (isNaN(secs) || secs < 0) return '0:00';
    const m = Math.floor(secs / 60);
    const s = Math.floor(secs % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  updatePlayBtn(isPlaying) {
    this.btnPlay.textContent = isPlaying ? '⏸' : '▶';
    if (isPlaying) {
      this.vwrap.classList.remove('paused');
    } else {
      this.vwrap.classList.add('paused');
    }
  }

  togglePlay() {
    if (this.vid.paused) {
      this.vid.play().catch(err => {
        this.setStatus(`Autoplay error: ${err.message}`, 'error');
      });
    } else {
      this.vid.pause();
    }
  }

  toggleMute() {
    this.vid.muted = !this.vid.muted;
    this.btnMute.textContent = this.vid.muted || this.vid.volume === 0 ? '🔇' : '🔊';
    this.volSlider.value = this.vid.muted ? 0 : this.vid.volume;
  }

  setVolume(val) {
    this.vid.volume = parseFloat(val);
    this.vid.muted = this.vid.volume === 0;
    this.btnMute.textContent = this.vid.muted ? '🔇' : '🔊';
  }

  adjustVolume(delta) {
    let newVol = Math.min(1, Math.max(0, this.vid.volume + delta));
    this.setVolume(newVol);
    this.volSlider.value = newVol;
  }

  seekBy(seconds) {
    this.vid.currentTime = Math.min(this.vid.duration || 0, Math.max(0, this.vid.currentTime + seconds));
  }

  seekToPosition(e) {
    const rect = this.seekContainer.getBoundingClientRect();
    const pos = (e.clientX - rect.left) / rect.width;
    if (this.vid.duration) {
      this.vid.currentTime = pos * this.vid.duration;
    }
  }

  updateProgress() {
    if (!this.vid.duration) return;
    const pct = (this.vid.currentTime / this.vid.duration) * 100;
    this.seekProg.style.width = `${pct}%`;
    this.seekThumb.style.left = `${pct}%`;
    this.timeDisplay.textContent = `${this.formatTime(this.vid.currentTime)} / ${this.formatTime(this.vid.duration)}`;
  }

  updateBuffer() {
    if (!this.vid.duration || !this.vid.buffered.length) return;
    const bufferedEnd = this.vid.buffered.end(this.vid.buffered.length - 1);
    const pct = (bufferedEnd / this.vid.duration) * 100;
    this.seekBuf.style.width = `${pct}%`;
  }

  toggleFullscreen() {
    if (!document.fullscreenElement) {
      this.vwrap.requestFullscreen().catch(err => alert(`Error entering fullscreen: ${err.message}`));
    } else {
      document.exitFullscreen();
    }
  }

  resolveProxyUrl(url) {
    const proxyMode = this.proxySelect.value;
    if (proxyMode === 'direct') return url;
    if (proxyMode === 'local') return `/proxy?url=${encodeURIComponent(url)}`;
    if (proxyMode === 'corsproxy') return `https://corsproxy.io/?${encodeURIComponent(url)}`;
    return url;
  }

  loadStream(targetUrl) {
    this.currentUrl = targetUrl;
    this.urlInput.value = targetUrl;

    // Destroy existing HLS instance
    if (this.hls) {
      this.hls.destroy();
      this.hls = null;
    }

    // Reset quality dropdown
    this.qualSelect.innerHTML = '<option value="-1">Auto Quality</option>';

    const proxied = this.resolveProxyUrl(targetUrl);
    const isM3U8 = targetUrl.includes('.m3u8') || targetUrl.endsWith('.m3u8');
    const isMp4 = targetUrl.endsWith('.mp4') || targetUrl.includes('.mp4');

    if (isM3U8) {
      this.showVideoMode('HLS / M3U8');
      if (Hls.isSupported()) {
        this.setStatus('Initializing HLS Engine...', 'normal');
        this.hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false
        });

        this.hls.loadSource(proxied);
        this.hls.attachMedia(this.vid);

        this.hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
          this.setStatus(`✅ Playing M3U8 Stream (${data.levels.length} levels available)`, 'success');
          
          data.levels.forEach((lvl, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.textContent = lvl.height ? `${lvl.height}p` : `Level ${idx}`;
            this.qualSelect.appendChild(opt);
          });

          this.vid.play().catch(() => {
            this.setStatus('Autoplay muted by browser. Click Play button.', 'normal');
          });
        });

        this.hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                this.setStatus('❌ Network error loading HLS stream. Try Proxy Mode.', 'error');
                this.hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                this.setStatus('⚠️ Media Error — Attempting recovery...', 'normal');
                this.hls.recoverMediaError();
                break;
              default:
                this.setStatus(`❌ Stream Error: ${data.details}`, 'error');
                this.hls.destroy();
                break;
            }
          }
        });
      } else if (this.vid.canPlayType('application/vnd.apple.mpegurl')) {
        // Native Safari HLS
        this.vid.src = proxied;
        this.vid.play();
        this.setStatus('✅ Playing Native Safari HLS', 'success');
      } else {
        this.setStatus('❌ HLS is not supported in this browser.', 'error');
      }
    } else if (isMp4) {
      this.showVideoMode('MP4 Direct');
      this.vid.src = proxied;
      this.vid.play().then(() => {
        this.setStatus('✅ Playing Direct MP4 Stream', 'success');
      }).catch(err => {
        this.setStatus(`❌ MP4 Playback error: ${err.message}`, 'error');
      });
    } else {
      // Iframe fallback for embed links
      this.showIframeMode(targetUrl);
    }
  }

  showVideoMode(label) {
    this.iframeWrap.style.display = 'none';
    this.vid.style.display = 'block';
    this.modeBadge.textContent = label;
  }

  showIframeMode(embedUrl) {
    this.vid.style.display = 'none';
    this.iframeWrap.style.display = 'block';
    this.iframePlayer.src = embedUrl;
    this.modeBadge.textContent = 'IFrame Embed';
    this.setStatus('✅ Embedded Page Loaded in IFrame', 'success');
  }
}

// Global initialization
window.addEventListener('DOMContentLoaded', () => {
  window.playersmoy = new PlayersMoy();
});

  </script>
